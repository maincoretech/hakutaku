name: CI & Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Public API documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p hakutaku-core -p hakutaku-pack --no-deps

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-llvm-cov
      - name: Runtime and publisher line coverage
        run: cargo llvm-cov -p hakutaku-core -p hakutaku-pack --fail-under-lines 97.5
      - name: CLI argument line coverage
        run: cargo llvm-cov -p hakutaku-cli --fail-under-lines 45
      - name: Wire-format line coverage
        run: >-
          cargo llvm-cov -p hakutaku-core --lib
          --ignore-filename-regex
          '/(cache|crypto|error|io|package)\.rs$'
          --fail-under-lines 100

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  mobile-core:
    name: Core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-ios
            platform: iOS
          - os: ubuntu-latest
            target: aarch64-linux-android
            platform: Android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup target add ${{ matrix.target }}
      - name: Configure Android NDK
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check -p hakutaku-core --target ${{ matrix.target }}

  build-cli:
    name: CLI (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p hakutaku-cli --target ${{ matrix.target }}
      - name: Package executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/hakutaku.exe" "hakutaku-${{ matrix.suffix }}.exe"
          else
            cp "target/${{ matrix.target }}/release/hakutaku" "hakutaku-${{ matrix.suffix }}"
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hakutaku-cli-${{ matrix.suffix }}
          path: hakutaku-${{ matrix.suffix }}*

  build-gui:
    name: GUI (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup target add ${{ matrix.target }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo build --release -p hakutaku-gui --target ${{ matrix.target }}
      - name: Package executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/hakutaku-gui.exe" "hakutaku-gui-${{ matrix.suffix }}.exe"
          else
            cp "target/${{ matrix.target }}/release/hakutaku-gui" "hakutaku-gui-${{ matrix.suffix }}"
          fi
      - name: Create macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="hakutaku-gui-${{ matrix.suffix }}.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/hakutaku-gui" "$app/Contents/MacOS/hakutaku-gui"
          cp assets/icons/hakutaku.icns "$app/Contents/Resources/hakutaku.icns"
          chmod +x "$app/Contents/MacOS/hakutaku-gui"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleExecutable</key><string>hakutaku-gui</string>' \
            '<key>CFBundleName</key><string>Hakutaku</string>' \
            '<key>CFBundleIdentifier</key><string>moe.maincore.hakutaku</string>' \
            '<key>CFBundleIconFile</key><string>hakutaku.icns</string>' \
            '<key>CFBundleVersion</key><string>1</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '</dict></plist>' > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$app.zip"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hakutaku-gui-${{ matrix.suffix }}
          path: |
            hakutaku-gui-${{ matrix.suffix }}*
            !hakutaku-gui-${{ matrix.suffix }}.app/**

  release:
    name: Tag and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, coverage, security, mobile-core, build-cli, build-gui]
    runs-on: ubuntu-latest
    concurrency:
      group: hakutaku-main-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: hakutaku-*
          path: release-assets
          merge-multiple: true
      - name: Select next patch version
        id: version
        shell: bash
        run: |
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_version="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml)"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid workspace package version: $base_version" >&2
            exit 1
          fi

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$latest_tag" ]]; then
            next_version="$base_version"
          else
            latest_version="${latest_tag#v}"
            highest="$(printf '%s\n%s\n' "$base_version" "$latest_version" | sort -V | tail -n 1)"
            if [[ "$highest" == "$base_version" && "$base_version" != "$latest_version" ]]; then
              next_version="$base_version"
            else
              IFS=. read -r major minor patch <<< "$latest_version"
              next_version="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          shopt -s nullglob
          assets=(*)
          if (( ${#assets[@]} == 0 )); then
            echo "no release assets were downloaded" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Hakutaku $RELEASE_TAG" \
              --generate-notes
          fi
