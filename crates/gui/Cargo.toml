[package]
name = "hakutaku-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resource and release manager for Hakutaku game packages"

[[bin]]
name = "hakutaku-gui"
path = "src/main.rs"

[dependencies]
hakutaku-core.workspace = true
hakutaku-pack.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "links", "glow", "x11", "wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# GTK is confined to the Linux developer GUI. Core, CLI, macOS, and Windows do
# not inherit a portal async runtime or Linux UI dependency surface.
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
